# golangci-lint v2: strict config for a project that wants feedback from day one.
# Run: make lint   ·   Docs: https://golangci-lint.run
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # bugs
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    # resources
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    # context
    - contextcheck
    - noctx
    # errors
    - errorlint
    - wrapcheck
    # security
    - gosec
    # style
    - revive
    - gocritic
    - misspell
    # complexity (loose limits)
    - gocyclo
    - funlen

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # struct field order for memory; too noisy while learning
    errcheck:
      check-type-assertions: true
      check-blank: true # `x, _ := f()` also counts as ignoring the error
    wrapcheck:
      # errors we create ourselves or that are already wrapped don't need wrapping again
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
    revive:
      rules:
        - name: exported
        - name: package-comments
          disabled: true
        - name: var-naming
        - name: error-naming
        - name: error-strings
        - name: receiver-naming
        - name: indent-error-flow
        - name: unused-parameter
        - name: context-as-argument
        - name: context-keys-type
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam # passing small structs by value is fine for this project
    gocyclo:
      min-complexity: 15
    funlen:
      lines: 80
      statements: 50
    misspell:
      locale: US

  exclusions:
    generated: strict
    presets:
      - std-error-handling
    rules:
      # tests may be long, ignore errors in cleanup, and skip wrapping
      - path: _test\.go
        linters:
          - funlen
          - wrapcheck
          - errcheck
          - gosec
      # sqlc-generated code is checked by sqlc, not by us
      - path: internal/repository/postgres/sqlc/
        linters:
          - revive
          - gocritic

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/irfanandriansyah1997/bang-backend
