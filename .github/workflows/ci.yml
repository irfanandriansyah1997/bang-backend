name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an older run when a new commit is pushed to the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint # required by the main ruleset; keep this name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Strict lint from .golangci.yml: formatters (gofmt, goimports), go vet, and the rest
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    name: Test # required by the main ruleset; keep this name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go build
        run: go build -o /dev/null ./...

      - name: go test
        run: go test -race -count=1 -cover ./...
