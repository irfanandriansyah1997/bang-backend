name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an older run when a new commit is pushed to the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint # required by the main ruleset; keep this name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Strict lint from .golangci.yml: formatters (gofmt, goimports), go vet, and the rest
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    name: Test # required by the main ruleset; keep this name
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: fieldservice_test
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before the steps start
        options: >-
          --health-cmd "pg_isready -U app -d fieldservice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Read by TestConnect_RealDatabase (and later by repository tests)
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/fieldservice_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go build
        run: go build -o /dev/null ./...

      - name: go test
        run: go test -race -count=1 -cover ./...
