name: Claude Review

# Comment "@claude-code-review" on a pull request to get a review from Claude
# Sonnet 5.5. Runs on the Claude Pro subscription via the
# CLAUDE_CODE_OAUTH_TOKEN secret (created with `claude setup-token`).
#
# The review only writes comments. It never edits files, commits, pushes, or
# merges: the job token cannot write to the repo (contents: read), the tool
# allow-list has no edit or git-write commands, and a deny-list blocks them
# explicitly. The engineer reads the comments and decides what to fix.
#
# One exception: for a minor finding a person skipped with /skip-suggestion,
# the review may write a NEW proposed ADR file (docs/adr/NNNN-*.md). The AI
# never commits it. The "Commit ADR" step below (a script in this file, so it
# always comes from main, never from the PR) checks that only such files were
# added, commits them as github-actions[bot], and pushes them with the
# ADR_PUSH_TOKEN secret (a push with GITHUB_TOKEN would not start Lint, Test,
# or claude-review-outdated.yml). The checkout keeps no credentials, so the AI
# never sees a token that can push.
#
# The run also reports a commit status named "Claude Review" on the PR head:
# pending while it runs, then the review's verdict: success when Claude says the
# code is ready to merge, failure when it says needs changes or blocked (or the
# review failed). The status follows the verdict, not whether the job ran. An
# issue_comment job runs on main, so its own check would never show on the PR;
# a commit status is how the PR (and the main ruleset) can see it.
on:
  issue_comment:
    types: [created]

# One review per PR at a time: a new comment cancels a running review.
# Comments from bots get their own group, so the review's own summary comment
# (it mentions the trigger phrase in its footer) can never cancel a running review.
concurrency:
  group: claude-review-${{ github.event.issue.number }}-${{ github.event.comment.user.type }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    name: Claude Review
    # PR comments only (not issues), written by a person (not a bot, or the
    # review's own summary comment would start another review), with the trigger phrase
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '@claude-code-review')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # inline + summary comments
      issues: write # reaction and reply on the trigger comment
      checks: read # read Lint/Test results
      statuses: write # report the "Claude Review" status on the PR head
      id-token: write # claude-code-action authentication
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      COMMENTER: ${{ github.event.comment.user.login }}
      MODEL: claude-sonnet-5-5 # the review decides the merge status, so use a stronger model; claude-haiku-5-5 is the cheap one
      STATUS_CONTEXT: Claude Review # name of the commit status (the ruleset uses this name)
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Only collaborators with write access
        run: |
          perm=$(gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq .permission 2>/dev/null || echo none)
          case "$perm" in
            admin|maintain|write) echo "$COMMENTER has $perm access" ;;
            *) echo "::notice::$COMMENTER has '$perm' access; skipping review"; exit 1 ;;
          esac

      - name: React to the trigger comment
        id: react
        run: |
          id=$(gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes --jq .id)
          echo "eyes_id=$id" >> "$GITHUB_OUTPUT"

      - name: Require green Lint and Test on the PR head
        id: gate
        run: |
          sha=$(gh pr view "$PR" -R "$REPO" --json headRefOid -q .headRefOid)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          results=$(gh api "repos/$REPO/commits/$sha/check-runs" \
            --jq '[.check_runs[] | select(.name=="Lint" or .name=="Test") | "\(.name)=\(.conclusion // .status)"] | join(" ")')
          echo "Checks on ${sha:0:7}: $results"
          case " $results " in
            *" Lint=success "*) lint_ok=1 ;;
          esac
          case " $results " in
            *" Test=success "*) test_ok=1 ;;
          esac
          if [ "${lint_ok:-}" = 1 ] && [ "${test_ok:-}" = 1 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR" -R "$REPO" --body "⏸️ **Review skipped:** Lint and Test must both pass on \`${sha:0:7}\` first (now: \`${results:-no checks yet}\`). Fix them, wait for CI to go green, then comment \`@claude-code-review\` again."
          fi

      - name: Mark the review as running
        if: steps.gate.outputs.ok == 'true'
        env:
          SHA: ${{ steps.gate.outputs.sha }}
        run: |
          gh api "repos/$REPO/statuses/$SHA" \
            -f state=pending -f context="$STATUS_CONTEXT" \
            -f description="Claude is reviewing this commit" -f target_url="$RUN_URL" >/dev/null

      - name: Check out the PR head
        if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false # the AI step must not find a token that can push

      - name: Review with Claude
        id: review
        if: steps.gate.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/check-pr ${{ github.event.issue.number }} --ci"
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 60
            --disallowedTools "Edit,MultiEdit,NotebookEdit,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git reset:*),Bash(git checkout:*),Bash(gh pr merge:*),Bash(gh pr review:*)"
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git ls-tree:*),Bash(grep:*),Bash(sh scripts/hooks/commit-msg.sh:*),Read,Write,Grep,Glob"

      # Runs even when the review fails or is cancelled, so the status never stays "pending".
      - name: Report the final review status
        id: status
        if: always() && steps.gate.outputs.sha != ''
        env:
          SHA: ${{ steps.gate.outputs.sha }}
          GATE_OK: ${{ steps.gate.outputs.ok }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          if [ "$GATE_OK" != "true" ]; then
            state=failure
            description="Lint and Test must pass first"
          else
            # A newer run may have replaced our "pending" status (this run was
            # cancelled by it). Only the run that wrote the latest status may finish it.
            latest=$(gh api "repos/$REPO/commits/$SHA/statuses" \
              --jq '[.[] | select(.context == env.STATUS_CONTEXT)][0].target_url // empty')
            if [ "$latest" != "$RUN_URL" ]; then
              echo "A newer run owns the status of ${SHA:0:7}; leaving it as it is"
              echo "state=skipped" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$REVIEW_OUTCOME" != "success" ]; then
              state=failure
              description="The review failed or was cancelled; comment @claude-code-review to run it again"
            else
              # The review decides. The summary comment has a marker line like
              # "<!-- check-pr-verdict: ready; commit: <full sha> -->" (see the check-pr skill).
              summary=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                --jq '.[] | select(.body | startswith("<!-- check-pr -->")) | .body')
              marker=$(printf '%s\n' "$summary" \
                | sed -n 's/^<!-- check-pr-verdict: \([a-z-]*\); commit: \([0-9a-f]\{40\}\) -->$/\1 \2/p' | tail -1)
              if [ -n "$marker" ]; then
                verdict=${marker% *}
                reviewed=${marker#* }
                expected=$SHA
              else
                # A PR branch that still has the older skill writes no marker. Read the
                # heading ("## PR check: Ready") and the short commit instead.
                heading=$(printf '%s\n' "$summary" | sed -n 's/^## .*PR check: \([A-Za-z ]*\).*/\1/p' | tail -1)
                case "$heading" in
                  Ready*) verdict=ready ;;
                  "Needs changes"*) verdict=needs-changes ;;
                  Blocked*) verdict=blocked ;;
                  *) verdict="" ;;
                esac
                reviewed=$(printf '%s\n' "$summary" | sed -n 's/^\*\*Commit:\*\* `\([0-9a-f]*\)`.*/\1/p' | tail -1)
                expected=${SHA:0:7}
              fi
              if [ -z "$verdict" ] || [ "$reviewed" != "$expected" ]; then
                state=failure
                description="Claude did not post a verdict for this commit; comment @claude-code-review to run it again"
              elif [ "$verdict" = "ready" ]; then
                state=success
                description="✅ Claude: ready to merge"
              elif [ "$verdict" = "blocked" ]; then
                state=failure
                description="⛔ Claude: blocked, see the review comments"
              else
                state=failure
                description="❌ Claude: needs changes, see the review comments"
              fi
            fi
          fi
          # The next step reads this to pick the reaction, so write it before the API call.
          echo "state=$state" >> "$GITHUB_OUTPUT"
          # GitHub rejects 4-byte Unicode in a status description (most emoji, like the
          # rocket or fire). Use plain text or symbols from the basic plane (✅ ❌ ⛔) only.
          gh api "repos/$REPO/statuses/$SHA" \
            -f state="$state" -f context="$STATUS_CONTEXT" \
            -f description="$description" -f target_url="$RUN_URL" >/dev/null
          echo "Claude Review on ${SHA:0:7}: $state"

      # Replace the "eyes" reaction on the trigger comment with the result:
      # rocket = ready to merge, -1 (thumbs down) = needs fixes (GitHub has no fire reaction).
      - name: Show the result on the trigger comment
        if: always() && steps.react.outcome == 'success' && (steps.status.outputs.state == 'success' || steps.status.outputs.state == 'failure')
        env:
          EYES_ID: ${{ steps.react.outputs.eyes_id }}
          STATE: ${{ steps.status.outputs.state }}
        run: |
          gh api -X DELETE "repos/$REPO/issues/comments/$COMMENT_ID/reactions/$EYES_ID" >/dev/null || true
          if [ "$STATE" = "success" ]; then reaction=rocket; else reaction="-1"; fi
          gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content="$reaction" >/dev/null
          echo "Reaction on the trigger comment: $reaction"

      # Commit the proposed ADRs the review wrote for skipped minors (check-pr step 4b).
      # Runs after the status step on purpose: the reviewed commit must already have its
      # verdict, so claude-review-outdated.yml can carry it over to the ADR commit.
      # This is a script, not the AI. It commits only new docs/adr/NNNN-*.md files with
      # "Status: proposed" and refuses anything else.
      - name: Commit ADR
        if: always() && steps.review.outcome == 'success' && (steps.status.outputs.state == 'success' || steps.status.outputs.state == 'failure')
        env:
          SHA: ${{ steps.gate.outputs.sha }}
          PUSH_TOKEN: ${{ secrets.ADR_PUSH_TOKEN }}
        run: |
          adr_re='^docs/adr/[0-9]{4}-[a-z0-9-]+\.md$'
          note() { gh pr comment "$PR" -R "$REPO" --body "$1" >/dev/null; }
          refuse() {
            echo "::error::$1"
            note "⚠️ **ADR not committed:** $1 Nothing was pushed. [Run log]($RUN_URL)"
            exit 1
          }

          new=$(git ls-files --others --exclude-standard -- docs/adr/)
          if [ -z "$new" ]; then
            echo "The review wrote no new ADR"
            exit 0
          fi
          echo "New files in docs/adr/:"; echo "$new"

          # The review may only ADD files. Any change to a tracked file is refused.
          changed=$(git diff --name-only HEAD)
          [ -z "$changed" ] || refuse "the review changed tracked files (\`$(echo $changed)\`), and only new ADR files are allowed."

          for f in $new; do
            echo "$f" | grep -qE "$adr_re" || refuse "\`$f\` is not a \`docs/adr/NNNN-short-title.md\` file."
            num=$(basename "$f" | cut -c1-4)
            [ "$num" != "0000" ] || refuse "\`$f\` uses the template number 0000."
            taken=$( { git ls-tree --name-only HEAD docs/adr/; git ls-tree --name-only origin/main docs/adr/; } \
              | grep -c "^docs/adr/$num-" || true)
            [ "$taken" = "0" ] || refuse "\`$f\` reuses ADR number $num."
            [ "$(echo "$new" | grep -c "^docs/adr/$num-")" = "1" ] || refuse "two new ADRs use number $num."
            grep -qxF -- '- **Status:** proposed' "$f" || refuse "\`$f\` must have \`- **Status:** proposed\`."
            if grep -qE 'ghp_|gho_|ghs_|github_pat_|sk-ant-|-----BEGIN [A-Z ]*PRIVATE KEY' "$f"; then
              refuse "\`$f\` looks like it contains a token or key."
            fi
          done

          pr=$(gh pr view "$PR" -R "$REPO" --json headRefOid,headRefName,isCrossRepository)
          head=$(echo "$pr" | jq -r .headRefOid)
          branch=$(echo "$pr" | jq -r .headRefName)
          if [ "$(echo "$pr" | jq -r .isCrossRepository)" = "true" ]; then
            refuse "the PR comes from a fork, so the workflow cannot push to it."
          fi
          if [ "$head" != "$SHA" ]; then
            note "⚠️ **ADR not committed:** the PR branch moved from \`${SHA:0:7}\` to \`${head:0:7}\` during the review. Run the review again on the new commit."
            exit 0
          fi
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::warning::ADR_PUSH_TOKEN is not set"
            note "⚠️ **ADR not committed:** the \`ADR_PUSH_TOKEN\` secret is not set (see \`docs/adr/README.md\`). The review wrote: $(echo $new)."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # shellcheck disable=SC2086
          git add -- $new
          if git diff --cached --name-only | grep -vqE "$adr_re"; then
            refuse "the staged files are not only ADR files."
          fi
          {
            echo "docs(adr): record skipped suggestions from PR #$PR"
            echo
            echo "The review of ${SHA:0:7} turned minor findings that a reviewer"
            echo "skipped with /skip-suggestion into proposed ADRs:"
            echo
            for f in $new; do echo "- $f"; done
            echo
            echo "Refs: #$PR"
          } > "$RUNNER_TEMP/adr-commit-msg.txt"
          git commit -q -F "$RUNNER_TEMP/adr-commit-msg.txt"
          adr_sha=$(git rev-parse HEAD)

          # A plain push (no --force): it fails if someone pushed in the meantime.
          if ! git push -q "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/$branch"; then
            refuse "the push to \`$branch\` failed (the branch may have moved, or the token cannot write)."
          fi
          list=$(for f in $new; do printf -- '- `%s` (proposed)\n' "$f"; done)
          note "📝 **ADR committed** in \`${adr_sha:0:7}\` on top of the reviewed commit \`${SHA:0:7}\`:

          $list

          This commit only adds \`docs/adr/*.md\`, so the review verdict is carried over to it and no new review is needed."
          echo "Pushed ${adr_sha:0:7} to $branch"
