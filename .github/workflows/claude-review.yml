name: Claude Review

# Comment "@claude-code-review" on a pull request to get a review from Claude
# Haiku 5.5. Runs on the Claude Pro subscription via the
# CLAUDE_CODE_OAUTH_TOKEN secret (created with `claude setup-token`).
#
# The review only writes comments. It never edits files, commits, pushes, or
# merges: the job token cannot write to the repo (contents: read), the tool
# allow-list has no edit or git-write commands, and a deny-list blocks them
# explicitly. The engineer reads the comments and decides what to fix.
#
# The run also reports a commit status named "Claude Review" on the PR head:
# pending while it runs, then the review's verdict: success when Claude says the
# code is ready to merge, failure when it says needs changes or blocked (or the
# review failed). The status follows the verdict, not whether the job ran. An
# issue_comment job runs on main, so its own check would never show on the PR;
# a commit status is how the PR (and the main ruleset) can see it.
on:
  issue_comment:
    types: [created]

# One review per PR at a time: a new comment cancels a running review.
# Comments from bots get their own group, so the review's own summary comment
# (it mentions the trigger phrase in its footer) can never cancel a running review.
concurrency:
  group: claude-review-${{ github.event.issue.number }}-${{ github.event.comment.user.type }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    name: Claude Review
    # PR comments only (not issues), written by a person (not a bot, or the
    # review's own summary comment would start another review), with the trigger phrase
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '@claude-code-review')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # inline + summary comments
      issues: write # reaction and reply on the trigger comment
      checks: read # read Lint/Test results
      statuses: write # report the "Claude Review" status on the PR head
      id-token: write # claude-code-action authentication
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      COMMENTER: ${{ github.event.comment.user.login }}
      MODEL: claude-haiku-5-5 # cheapest model; change here to try another one
      STATUS_CONTEXT: Claude Review # name of the commit status (the ruleset uses this name)
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Only collaborators with write access
        run: |
          perm=$(gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq .permission 2>/dev/null || echo none)
          case "$perm" in
            admin|maintain|write) echo "$COMMENTER has $perm access" ;;
            *) echo "::notice::$COMMENTER has '$perm' access; skipping review"; exit 1 ;;
          esac

      - name: React to the trigger comment
        run: gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null

      - name: Require green Lint and Test on the PR head
        id: gate
        run: |
          sha=$(gh pr view "$PR" -R "$REPO" --json headRefOid -q .headRefOid)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          results=$(gh api "repos/$REPO/commits/$sha/check-runs" \
            --jq '[.check_runs[] | select(.name=="Lint" or .name=="Test") | "\(.name)=\(.conclusion // .status)"] | join(" ")')
          echo "Checks on ${sha:0:7}: $results"
          case " $results " in
            *" Lint=success "*) lint_ok=1 ;;
          esac
          case " $results " in
            *" Test=success "*) test_ok=1 ;;
          esac
          if [ "${lint_ok:-}" = 1 ] && [ "${test_ok:-}" = 1 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR" -R "$REPO" --body "⏸️ **Review skipped:** Lint and Test must both pass on \`${sha:0:7}\` first (now: \`${results:-no checks yet}\`). Fix them, wait for CI to go green, then comment \`@claude-code-review\` again."
          fi

      - name: Mark the review as running
        if: steps.gate.outputs.ok == 'true'
        env:
          SHA: ${{ steps.gate.outputs.sha }}
        run: |
          gh api "repos/$REPO/statuses/$SHA" \
            -f state=pending -f context="$STATUS_CONTEXT" \
            -f description="Claude is reviewing this commit" -f target_url="$RUN_URL" >/dev/null

      - name: Check out the PR head
        if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.sha }}
          fetch-depth: 0

      - name: Review with Claude
        id: review
        if: steps.gate.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/check-pr ${{ github.event.issue.number }} --ci"
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 60
            --disallowedTools "Edit,MultiEdit,NotebookEdit,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git reset:*),Bash(git checkout:*),Bash(gh pr merge:*),Bash(gh pr review:*)"
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(grep:*),Bash(sh scripts/hooks/commit-msg.sh:*),Read,Write,Grep,Glob"

      # Runs even when the review fails or is cancelled, so the status never stays "pending".
      - name: Report the final review status
        if: always() && steps.gate.outputs.sha != ''
        env:
          SHA: ${{ steps.gate.outputs.sha }}
          GATE_OK: ${{ steps.gate.outputs.ok }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          if [ "$GATE_OK" != "true" ]; then
            state=failure
            description="Lint and Test must pass first"
          else
            # A newer run may have replaced our "pending" status (this run was
            # cancelled by it). Only the run that wrote the latest status may finish it.
            latest=$(gh api "repos/$REPO/commits/$SHA/statuses" \
              --jq '[.[] | select(.context == env.STATUS_CONTEXT)][0].target_url // empty')
            if [ "$latest" != "$RUN_URL" ]; then
              echo "A newer run owns the status of ${SHA:0:7}; leaving it as it is"
              exit 0
            fi
            if [ "$REVIEW_OUTCOME" != "success" ]; then
              state=failure
              description="The review failed or was cancelled; comment @claude-code-review to run it again"
            else
              # The review decides. The summary comment has a marker line like
              # "<!-- check-pr-verdict: ready; commit: <full sha> -->" (see the check-pr skill).
              marker=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                --jq '.[] | select(.body | startswith("<!-- check-pr -->")) | .body' \
                | sed -n 's/^<!-- check-pr-verdict: \([a-z-]*\); commit: \([0-9a-f]\{40\}\) -->$/\1 \2/p' | tail -1)
              verdict=${marker% *}
              reviewed=${marker#* }
              if [ -z "$marker" ] || [ "$reviewed" != "$SHA" ]; then
                state=failure
                description="Claude did not post a verdict for this commit; comment @claude-code-review to run it again"
              elif [ "$verdict" = "ready" ]; then
                state=success
                description="Claude: ready to merge"
              elif [ "$verdict" = "blocked" ]; then
                state=failure
                description="Claude: blocked, see the review comments"
              else
                state=failure
                description="Claude: needs changes, see the review comments"
              fi
            fi
          fi
          gh api "repos/$REPO/statuses/$SHA" \
            -f state="$state" -f context="$STATUS_CONTEXT" \
            -f description="$description" -f target_url="$RUN_URL" >/dev/null
          echo "Claude Review on ${SHA:0:7}: $state"
