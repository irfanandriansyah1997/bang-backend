# Git hooks (like husky in Node.js). Install once per clone: `make hooks`.
# Docs: https://lefthook.dev

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.go"
      # strict lint from .golangci.yml (formatting, vet, and the rest)
      run: golangci-lint run ./...
    build:
      glob: "*.go"
      run: go build -o /dev/null ./...
    test:
      glob: "*.go"
      run: go test ./...

commit-msg:
  commands:
    conventional:
      run: sh scripts/hooks/commit-msg.sh {1}
